[project]
name = "yt-summary"
version = "0.1.0"
description = "YouTube 影片轉重點文章 pipeline"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2025.1.1",
    "pyyaml>=6.0",
    "opencc>=1.4.0",
]

[project.scripts]
yts = "yt_summary.cli:main"
yt-summary = "yt_summary.cli:main"  # 舊名保留(文件/肌肉記憶),與 yts 等價

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_summary"]
