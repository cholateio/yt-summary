# PROJECT.toml — 專案 manifest(機器可讀,`proj` 指令據此做跨專案彙總)。
# user-owned:kit 永不覆蓋。狀態/指令/付費服務改變時同步本檔,並更新 updated。

name = "yt-summary"
status = "active"          # active | mvp | done | paused | abandoned
status_note = "v1 pipeline 完整可跑(M1-M8/quick/vault/remove,78 測試全過);近期在修 opencc 簡轉繁邊界 case,下一步視使用狀況決定是否擴充"
updated = 2026-07-11       # 最後一次人工確認本檔內容的日期

[commands]                 # key = 用途短名;value = 可直接複製執行的指令
summary = "uv run yt-summary \"<youtube-url>\" --type A"
summary_mode = "uv run yt-summary \"<youtube-url>\" --type A --mode full"
remove = "uv run yt-summary remove <video-id-or-url>"

# 每個付費/可能付費的外部服務一節 [[paid]];完全沒有就整段刪掉
[[paid]]
service = "Claude Code 訂閱(headless claude -p)" # 待確認:是否視為本專案專屬成本
billing = "月費"
monthly_est = "?" # 訂閱與其他專案共用,非本專案增量成本;design D5 明訂選此路徑為求零邊際成本
cancel = "取消 Claude Code 訂閱本專案即無法呼叫 LLM(llm.py 唯一入口 claude -p);不涉及額外 API key"
