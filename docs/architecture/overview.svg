<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" role="img" aria-labelledby="yts-title yts-desc" font-family="'JetBrains Mono',monospace">
  <title id="yts-title">yt-summary system overview</title>
  <desc id="yts-desc">A local CLI fetches YouTube metadata and subtitles, cleans them into a transcript, then writes an article through either a single-pass quick path or a map-reduce path, both calling the headless Claude CLI; the output writer converts to Traditional Chinese and saves run artifacts and a copy into the knowledge vault inbox.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="icon-bucket" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16l-2 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L4 6z"/>
      <ellipse cx="12" cy="6" rx="8" ry="2.2"/>
    </symbol>
    <symbol id="icon-chip" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="6" width="12" height="12" rx="2"/>
      <rect x="9.5" y="9.5" width="5" height="5"/>
      <path d="M9 6V3M15 6V3M9 21v-3M15 21v-3M6 9H3M6 15H3M21 9h-3M21 15h-3"/>
    </symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 18a4.5 4.5 0 1 1 .8-8.9A6 6 0 0 1 19.5 11 3.75 3.75 0 0 1 18 18H7z"/>
    </symbol>
    <symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2h8l4 4v16H6V2z"/>
      <path d="M14 2v4h4"/>
      <line x1="9" y1="12" x2="15" y2="12"/>
      <line x1="9" y1="16" x2="15" y2="16"/>
    </symbol>
    <symbol id="icon-gear" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>
    </symbol>
    <symbol id="icon-sparkle" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
      <path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16z"/>
    </symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="M6 10l3 2-3 2"/>
      <line x1="11" y1="15" x2="16" y2="15"/>
    </symbol>
  </defs>

  <rect width="1200" height="628" fill="#faf8f4"/>

  <text x="600" y="84" font-size="28" letter-spacing="6" text-anchor="middle" fill="#1a1a1a">YT-SUMMARY · SYSTEM OVERVIEW</text>

  <g class="zone" id="zone-external" fill="none" stroke="#1a1a1a">
    <rect x="88" y="120" width="480" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="112" y="148" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">EXTERNAL</text>
    <line x1="112" y1="156" x2="160" y2="156" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-pipeline" fill="none" stroke="#1a1a1a">
    <rect x="88" y="312" width="744" height="256" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="112" y="340" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">PIPELINE</text>
    <line x1="112" y1="348" x2="160" y2="348" stroke-width="1"/>
  </g>
  <g class="zone" id="zone-local" fill="none" stroke="#1a1a1a">
    <rect x="872" y="312" width="240" height="256" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="896" y="340" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">LOCAL FILES</text>
    <line x1="896" y1="348" x2="944" y2="348" stroke-width="1"/>
  </g>

  <g fill="none" stroke="#1a1a1a" stroke-width="1.5">
    <path class="edge" id="e-youtube-fetch" d="M268,248 V370" marker-end="url(#ah)"/>
    <path class="edge" id="e-fetch-quick" d="M304,408 H346" marker-end="url(#ah)"/>
    <path class="edge" id="e-fetch-mapreduce" d="M208,440 V512 H346" marker-end="url(#ah)"/>
    <path class="edge" id="e-quick-claude" d="M448,370 V254" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <path class="edge" id="e-mapreduce-claude" d="M550,512 H580 V216 H550" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <path class="edge" id="e-quick-writer" d="M544,408 H572 a8,8 0 0,1 16,0 H610" marker-end="url(#ah)"/>
    <path class="edge" id="e-mapreduce-writer" d="M544,528 H712 V446" marker-end="url(#ah)"/>
    <path class="edge" id="e-writer-runout" d="M808,408 H890" marker-end="url(#ah)"/>
    <path class="edge" id="e-writer-vault" d="M748,440 V512 H890" marker-end="url(#ah)"/>
  </g>

  <g class="node" id="n-youtube">
    <rect x="112" y="184" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-cloud" x="128" y="204" width="24" height="24"/>
    <text x="168" y="212" font-size="14" font-weight="600" fill="#1a1a1a">YouTube</text>
    <text x="168" y="230" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Video + subtitles</text>
  </g>
  <g class="node" id="n-claude">
    <rect x="352" y="184" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-sparkle" x="368" y="204" width="24" height="24"/>
    <text x="408" y="212" font-size="14" font-weight="600" fill="#1a1a1a">Claude CLI</text>
    <text x="408" y="230" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Headless claude -p</text>
  </g>
  <g class="node" id="n-fetch">
    <rect x="112" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-terminal" x="128" y="396" width="24" height="24"/>
    <text x="168" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Fetch &amp; Clean</text>
    <text x="168" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Subs to transcript</text>
  </g>
  <g class="node" id="n-quick">
    <rect x="352" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-chip" x="368" y="396" width="24" height="24"/>
    <text x="408" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Quick Path</text>
    <text x="408" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Single-pass article</text>
  </g>
  <g class="node" id="n-mapreduce">
    <rect x="352" y="480" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-gear" x="368" y="500" width="24" height="24"/>
    <text x="408" y="508" font-size="14" font-weight="600" fill="#1a1a1a">Map-Reduce</text>
    <text x="408" y="526" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Chunk, note, merge</text>
  </g>
  <g class="node" id="n-writer">
    <rect x="616" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-file" x="632" y="396" width="24" height="24"/>
    <text x="672" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Output Writer</text>
    <text x="672" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">zh-TW convert, save</text>
  </g>
  <g class="node" id="n-runout">
    <rect x="896" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-file" x="912" y="396" width="24" height="24"/>
    <text x="952" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Run Output</text>
    <text x="952" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Artifacts + run log</text>
  </g>
  <g class="node" id="n-vault">
    <rect x="896" y="480" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-bucket" x="912" y="500" width="24" height="24"/>
    <text x="952" y="508" font-size="14" font-weight="600" fill="#1a1a1a">Vault Raw</text>
    <text x="952" y="526" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Knowledge inbox</text>
  </g>

  <g class="label" id="l-prompt" data-edge="e-quick-claude">
    <rect x="456" y="284" width="49" height="14" fill="#faf8f4"/>
    <text x="460" y="294" font-size="10" letter-spacing="1" fill="#1a1a1a">PROMPT</text>
  </g>
</svg>
